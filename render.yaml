services:
  - type: web
    name: pulseshift
    runtime: docker
    dockerfilePath: pulseshift/Dockerfile
    dockerContext: pulseshift
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: tencent/hy3
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
